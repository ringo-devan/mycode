---
- name: Build the Panorama connection details
  ansible.builtin.set_fact:
    panos_provider:
      ip_address: "{{ panorama_ip }}"
      api_key: "{{ panorama_api_key }}"

- name: Create address objects from the change request
  paloaltonetworks.panos.panos_address_object:
    provider: "{{ panos_provider }}"
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    description: "{{change_id}}"
    state: present
  loop: "{{ address_objects }}"

- name: Create security rule
  paloaltonetworks.panos.panos_security_rule:
    provider: "{{ panos_provider }}"
    device_group: "{{device_group }}"
    rule_name: "{{ security_rule.name }}"
    source_zone: "{{ security_rule.source_zone }}"
    destination_zone: "{{ security_rule.destination_zone }}"
    source_ip: "{{ security_rule.source_ip }}"
    destination_ip: "{{ security_rule.destination_ip }}"
    application: "{{ security_rule.application }}"
    service: "{{ security_rule.service }}"
    action: "{{ security_rule.action }}"
    description: "{{ change_id }}"
    state: present

# tasks file for roles/panorama_rule
